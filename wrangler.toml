name = "filewing"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

# =====================================================
# リソースの自動プロビジョニング
# =====================================================
# d1_databases / r2_buckets には ID を意図的に記載していません。
# ID を省略すると wrangler deploy 時に Cloudflare が
# リソースを自動作成してバインディングに紐付けます（要 wrangler 4.45.0 以上）。
# これにより「Deploy to Cloudflare」ボタンからの
# ワンクリックデプロイが事前準備なしで動作します。
#
# account_id は環境変数 CLOUDFLARE_ACCOUNT_ID から取得されます。

# =====================================================
# 環境変数
# =====================================================
# この設定はそのままデプロイされる想定です（本番安全side）。
# AUTH_METHOD = "saml" のため、SESSION_SECRET などのシークレットが
# 未設定の状態では全リクエストがログインページにリダイレクトされます
# （＝フェイルクローズする）。認証設定を済ませるまでアプリが
# 無防備に公開されることはありません。
#
# ローカル開発で認証をスキップするには npm run dev を使用してください
# （--var AUTH_METHOD:skip を自動的に付与します）。
[vars]
AUTH_METHOD = "saml"  # "saml" | "cloudflare-access" | "skip"
SKIP_AUTH = "false"   # 後方互換用
EMAIL_FROM = "noreply@example.com"  # Email Routing検証済みアドレスに置き換えてください
SESSION_MAX_AGE = "86400"  # 1日（秒）

# アプリケーションURL（ログアウト後のリダイレクト先。未設定時は "/"）
# APP_URL = "https://your-domain.com"

# SAML設定（AUTH_METHOD = "saml" の場合に設定）
# SAML_ENTITY_ID = "https://your-domain.com"
# SAML_IDP_SSO_URL = ""  # IdPのSSO URL
# SAML_IDP_ENTITY_ID = ""  # IdPのEntity ID
# SAML_CALLBACK_URL = "https://your-domain.com/auth/saml/callback"

# ドメイン制限（カンマ区切り、空=全ドメイン許可）
# ALLOWED_DOMAINS = "company.com,partner.co.jp"

# Cloudflare Accessで認証する場合は
# AUTH_METHOD = "cloudflare-access" に変更して以下を設定
# ACCESS_TEAM_NAME = ""
# ACCESS_AUD = ""

# シークレット（wrangler secret put で設定。.dev.vars.example 参照）
# SESSION_SECRET - セッションJWT署名キー（32文字以上のランダム文字列）
# SAML_IDP_CERT  - IdP X.509証明書（Base64）

# =====================================================
# バインディング
# =====================================================
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "filewing-bucket"

[[d1_databases]]
binding = "DB"
database_name = "filewing-db"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

# 定期クリーンアップ（毎日深夜3時 JST = 18:00 UTC）
[triggers]
crons = ["0 18 * * *"]
