name = "filewing"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

# =====================================================
# リソースの自動プロビジョニング
# =====================================================
# d1_databases / r2_buckets には ID を意図的に記載していません。
# ID を省略すると wrangler deploy 時に Cloudflare が
# リソースを自動作成してバインディングに紐付けます（要 wrangler 4.45.0 以上）。
# これにより「Deploy to Cloudflare」ボタンからの
# ワンクリックデプロイが事前準備なしで動作します。
#
# account_id は環境変数 CLOUDFLARE_ACCOUNT_ID から取得されます。

# =====================================================
# 開発環境（トップレベル設定）
# =====================================================
# 注意: この [vars] は「ローカル開発用」です。
# AUTH_METHOD = "skip" は認証を完全にバイパスするため、
# この設定のままインターネットに公開してはいけません。
# 本番デプロイは必ず --env production を使用してください
# （npm run deploy が自動的に付与します）。
[vars]
AUTH_METHOD = "skip"
SKIP_AUTH = "true"  # 後方互換用
EMAIL_FROM = "noreply@example.com"  # Email Routing検証済みアドレスに置き換えてください
SESSION_MAX_AGE = "86400"  # 1日（秒）
APP_URL = "http://localhost:8787"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "filewing-bucket"

[[d1_databases]]
binding = "DB"
database_name = "filewing-db"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

# 定期クリーンアップ（毎日深夜3時 JST = 18:00 UTC）
[triggers]
crons = ["0 18 * * *"]

# =====================================================
# 本番環境設定（npm run deploy / デプロイボタンが使用）
# =====================================================
# AUTH_METHOD = "saml" がデフォルトです。
# SESSION_SECRET などのシークレットが未設定の場合は
# 全リクエストがログインページにリダイレクトされる
# （＝フェイルクローズする）ため、認証設定を済ませるまで
# アプリが無防備に公開されることはありません。
#
# デプロイ後に以下を設定してください:
#   1. wrangler secret put SESSION_SECRET --env production
#   2. wrangler secret put SAML_IDP_CERT --env production
#   3. SAML_* / APP_URL をIdPの値に合わせて書き換え
#
# Cloudflare Accessで認証する場合は
# AUTH_METHOD = "cloudflare-access" に変更し、
# ACCESS_TEAM_NAME / ACCESS_AUD を設定してください。
[env.production.vars]
AUTH_METHOD = "saml"
SKIP_AUTH = "false"
EMAIL_FROM = "noreply@example.com"  # Email Routing検証済みアドレスに置き換え
SESSION_MAX_AGE = "86400"
APP_URL = "https://your-domain.com"  # 実際のデプロイ先URLに置き換え

# SAML設定（IdPの値に置き換えてください）
SAML_ENTITY_ID = "https://your-domain.com"
SAML_IDP_SSO_URL = ""  # IdPのSSO URL
SAML_IDP_ENTITY_ID = ""  # IdPのEntity ID
SAML_CALLBACK_URL = "https://your-domain.com/auth/saml/callback"

# ドメイン制限（カンマ区切り、空=全ドメイン許可）
# ALLOWED_DOMAINS = "company.com,partner.co.jp"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "filewing-bucket"

[[env.production.d1_databases]]
binding = "DB"
database_name = "filewing-db"
migrations_dir = "migrations"

[[env.production.send_email]]
name = "EMAIL"

[env.production.triggers]
crons = ["0 18 * * *"]
