name = "filewing"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# account_id は環境変数 CLOUDFLARE_ACCOUNT_ID で設定するか、
# ローカルの .dev.vars に記載してください

# 開発環境では認証をスキップ
[vars]
SKIP_AUTH = "true"

# R2バケット
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "filewing-bucket"

# D1データベース
[[d1_databases]]
binding = "DB"
database_name = "filewing-db"
database_id = "YOUR_DATABASE_ID"  # 実際のIDに置き換えてください
migrations_dir = "migrations"

# Email Sending（Cloudflare Email Routing統合）
[[send_email]]
name = "EMAIL"

# 定期クリーンアップ（毎日深夜3時 JST = 18:00 UTC）
[triggers]
crons = ["0 18 * * *"]

# =====================================================
# 本番環境設定
# =====================================================
[env.production]
vars = { SKIP_AUTH = "false" }

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "filewing-bucket"

[[env.production.d1_databases]]
binding = "DB"
database_name = "filewing-db"
database_id = "YOUR_DATABASE_ID"  # 実際のIDに置き換えてください

[[env.production.send_email]]
name = "EMAIL"

# Cloudflare Access設定（本番環境で設定）
# ACCESS_TEAM_NAME: Cloudflare Accessのチーム名
# ACCESS_AUD: アプリケーションのAUD値
